<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>말을 걸어 두는 나무 — 이성훈</title>
<meta name="description" content="지나는 길에 잠시 멈춰 하지 못한 말을 걸어 두고 가는 나무. 이성훈, 2026.">
<link rel="icon" type="image/png" sizes="32x32" href="../site/img/favicon-32.png">
<link rel="apple-touch-icon" href="../site/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@400;500;600;700&display=swap">
<style>
  :root{--bg:#0a0b0a;--ink:#e6e3d8;--mute:#8a877c;--line:#2a2d28;--leaf:#a4e0a0;--gold:#f6d696;
    --sans:"Noto Serif KR","AppleMyungjo",serif;--serif:"Noto Serif KR","AppleMyungjo",serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow:hidden}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--leaf);outline-offset:3px;border-radius:4px}
  #tree{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block}

  .nav{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:28px clamp(18px,3vw,44px);font-size:13.5px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity 1.2s ease .4s,transform 1.2s ease .4s}
  body.settled .nav{opacity:1;transform:none;pointer-events:auto}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em;text-decoration:none}
  .brand .avatar{width:28px;height:28px;border-radius:50%;display:block;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  .nav nav{display:flex;gap:clamp(16px,2.4vw,32px);align-items:center}
  .nav nav a{color:#b9b6ab;text-decoration:none;transition:color .2s}
  .nav nav a:hover{color:#fff}
  .nav .pill{background:var(--ink);color:#0a0b0a;padding:9px 18px;border-radius:999px;font-weight:500}
  .nav .pill:hover{color:#0a0b0a;background:#fff}

  .copy{position:fixed;left:0;right:0;bottom:clamp(96px,14vh,150px);z-index:3;text-align:center;padding:0 20px;pointer-events:none}
  .copy > *{opacity:0;transform:translateY(10px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
  body.settled .copy > *{opacity:1;transform:none;pointer-events:auto}
  body.settled .copy > :nth-child(2){transition-delay:.25s}
  body.settled .copy > :nth-child(3){transition-delay:.5s}
  body.settled .copy > :nth-child(4){transition-delay:.75s}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
  .copy h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.2vw,64px);letter-spacing:-.02em;line-height:1.15;margin-top:12px;text-shadow:0 2px 24px #0a0b0a}
  .copy h1 .en{display:block;font-family:var(--mono);font-size:clamp(11px,.9vw,13px);letter-spacing:.42em;color:var(--mute);margin-top:12px;text-transform:uppercase}
  .copy p{margin:16px auto 0;max-width:420px;color:#b9b6ab;font-size:clamp(14px,1.05vw,16px);line-height:1.6;text-shadow:0 1px 16px #0a0b0a}
  .acts{display:flex;justify-content:center;gap:10px;margin-top:26px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #4a4d47;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:500;text-decoration:none;background:rgba(10,11,10,.5);backdrop-filter:blur(6px);transition:background .2s,border-color .2s,transform .25s}
  .btn:hover{border-color:var(--ink);transform:translateY(-1px)}
  .btn.solid{background:var(--ink);color:#0a0b0a;border-color:var(--ink)}
  .btn.solid:hover{background:#fff}

  .hang{position:fixed;left:50%;bottom:clamp(24px,4.5vh,44px);transform:translateX(-50%);z-index:3;display:flex;gap:8px;width:min(92vw,460px);opacity:0;transition:opacity 1.2s ease 1s}
  body.settled .hang{opacity:1}
  .hang input{flex:1;min-width:0;background:rgba(10,11,10,.6);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:11px 18px;font:inherit;font-size:14px;backdrop-filter:blur(6px)}
  .hang input::placeholder{color:#6f6c63}
  .hang input:focus{border-color:#5b5e57;outline:none}
  .hang button{background:transparent;border:1px solid var(--line);color:var(--leaf);border-radius:999px;padding:0 18px;font:inherit;font-size:14px;cursor:pointer}
  .hang button:hover{border-color:var(--leaf)}
  .note{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:3;font-size:11px;color:#5e5b53;white-space:nowrap;opacity:0;transition:opacity 1.2s ease 1.3s}
  body.settled .note{opacity:1}

  .corner{position:fixed;right:clamp(18px,3vw,44px);bottom:clamp(18px,3vh,32px);z-index:4;display:flex;gap:8px}
  .corner button{background:rgba(10,11,10,.4);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:8px 14px;font:inherit;font-size:12.5px;cursor:pointer;transition:opacity .6s,color .2s;backdrop-filter:blur(4px)}
  .corner button:hover{color:var(--ink)}
  body.settled .skip{opacity:0;pointer-events:none;width:0;padding:0;border:0;overflow:hidden}
  body.settled .corner{bottom:auto;top:78px}
  @media (max-width:640px){ body.settled .corner{display:none} }

  @media (max-width:640px){
    .nav nav a:not(.pill){display:none}
    .copy{bottom:120px}
    .note{display:none}
  }
  @media (prefers-reduced-motion: reduce){ .copy > *,.hang,.note{transition:none} }
</style>
</head>
<body>
  <canvas id="tree" aria-label="버드나무처럼 가지가 늘어진 나무에 사람들이 남긴 문장이 세로로 매달려 흔들리는 3D 장면. 처음에는 줄기 가까이에서 시작해 나무를 돌며 멀어진다."></canvas>

  <header class="nav">
    <a class="brand" href="./" aria-label="이성훈 — 처음 장면으로">
      <img class="avatar" src="../site/img/avatar.png" width="28" height="28" alt="">
      이성훈
    </a>
    <nav aria-label="주 메뉴">
      <a href="../site/">작업 소개</a>
      <a href="../site/#artist">작가</a>
      <a class="pill" href="../가시나무에_매달린_말들/index.html" target="_blank" rel="noopener">작품 열기</a>
    </nav>
  </header>

  <section class="copy" id="copy">
    <p class="eyebrow">Interactive Media Art · 2026</p>
    <h1>말을 걸어 두는 나무<span class="en">Words Left on a Tree</span></h1>
    <p>지나는 길에 잠시 멈춰 하지 못한 말을 걸어 두고 가는 나무. 내 말은 모르는 사람의 말 옆에 걸려 다음 사람을 기다린다.</p>
    <div class="acts">
      <a class="btn solid" href="../가시나무에_매달린_말들/index.html" target="_blank" rel="noopener">작품 열기 ↗</a>
      <a class="btn" href="../site/">작업 소개</a>
    </div>
  </section>

  <form class="hang" id="hang" autocomplete="off">
    <label class="sr" for="hangIn" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">나무에 걸어 둘 말</label>
    <input id="hangIn" maxlength="40" placeholder="하고 싶었던 말 한마디">
    <button type="submit">걸기</button>
  </form>
  <p class="note">창을 닫으면 걸어 둔 말도 흩어진다.</p>

  <div class="corner">
    <button class="skip" id="skip" type="button">건너뛰기</button>
    <button id="fs" type="button" aria-label="전체화면 (F)">전체화면</button>
  </div>

  <script src="sim.js"></script>
  <script src="tree3d.js"></script>
  <script>
    // 전체화면: 버튼이나 F 키 (브라우저는 클릭 없이 자동으로 켜는 걸 막음)
    const fsBtn = document.getElementById('fs');
    const toggleFs = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); };
    fsBtn.addEventListener('click', toggleFs);
    document.addEventListener('fullscreenchange', () => { fsBtn.textContent = document.fullscreenElement ? '창으로' : '전체화면'; });
    addEventListener('keydown', e => { if ((e.key === 'f' || e.key === 'F') && document.activeElement?.tagName !== 'INPUT') toggleFs(); });
    if (!document.documentElement.requestFullscreen) fsBtn.hidden = true;
    // 이름·프로필을 누르면 페이지를 다시 불러오지 않고 오프닝 첫 장면부터 다시
    document.querySelector('.brand').addEventListener('click', e => {
      if (!window.__landing?.restart || e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault(); document.activeElement?.blur(); window.__landing.restart();
    });
    document.getElementById('hang').addEventListener('submit', e => {
      e.preventDefault(); const i = document.getElementById('hangIn');
      if (hangWord(i.value)) i.value = '';
    });
  </script>
</body>
</html>
